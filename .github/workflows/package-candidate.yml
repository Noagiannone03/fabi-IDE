name: Package desktop candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    name: Package macOS arm64
    runs-on: macos-15
    timeout-minutes: 75
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable pinned Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install immutable dependencies
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Test the Fabi product contract
        run: yarn --cwd fabi-swarm test

      - name: Build the ad-hoc signed Apple Silicon candidate
        run: yarn --cwd electron-app package:mac

      - name: Verify the native application contract
        run: |
          app_path="$(find electron-app/dist -type d -name 'Fabi.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo 'electron-builder did not produce Fabi.app' >&2
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"

          identifier="$(codesign -dv --verbose=4 "$app_path" 2>&1 | sed -n 's/^Identifier=//p')"
          if [ "$identifier" != 'fr.undefinedstudio.fabi' ]; then
            echo "unexpected application identifier: $identifier" >&2
            exit 1
          fi

          expected_version="$(node -p "require('./electron-app/package.json').version")"
          packaged_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app_path/Contents/Info.plist")"
          if [ "$packaged_version" != "$expected_version" ]; then
            echo "unexpected packaged version: $packaged_version (expected $expected_version)" >&2
            exit 1
          fi

          executable="$app_path/Contents/MacOS/Fabi"
          if ! file "$executable" | grep -q 'arm64'; then
            echo 'the packaged Fabi executable is not Apple Silicon' >&2
            file "$executable" >&2
            exit 1
          fi

          entitlements="$RUNNER_TEMP/fabi-entitlements.plist"
          # `--entitlements -` prints Apple's human-readable `[Dict]` format on
          # current macOS runners. The colon form asks codesign for the XML
          # property list that PlistBuddy can validate deterministically.
          codesign -d --entitlements :- "$app_path" > "$entitlements" 2>/dev/null
          for entitlement in \
            com.apple.security.cs.allow-jit \
            com.apple.security.cs.disable-library-validation
          do
            value="$(/usr/libexec/PlistBuddy -c "Print :$entitlement" "$entitlements")"
            if [ "$value" != 'true' ]; then
              echo "missing required entitlement: $entitlement" >&2
              exit 1
            fi
          done

      - name: Record candidate checksums
        run: |
          cd electron-app/dist
          artifacts=()
          while IFS= read -r artifact; do
            artifacts+=("$artifact")
          done < <(find . -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.zip' -o -name '*.blockmap' -o -name '*.yml' \) \
            -print | LC_ALL=C sort)
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo 'electron-builder did not produce a macOS distribution artifact' >&2
            exit 1
          fi
          shasum -a 256 "${artifacts[@]}" | sed 's#  \./#  #' > SHA256SUMS

      - name: Upload the qualification candidate
        uses: actions/upload-artifact@v7
        with:
          name: fabi-macos-arm64-candidate
          path: |
            electron-app/dist/*.dmg
            electron-app/dist/*.zip
            electron-app/dist/*.blockmap
            electron-app/dist/*.yml
            electron-app/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 3

  windows-x64:
    name: Package Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout candidate revision
        uses: actions/checkout@v6

      - name: Setup Node 22
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable pinned Yarn Classic
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install immutable dependencies
        shell: bash
        run: yarn install --frozen-lockfile --network-timeout 600000

      - name: Test the Fabi product contract
        shell: bash
        run: yarn --cwd fabi-swarm test

      - name: Build the NSIS installer
        shell: bash
        run: yarn --cwd electron-app package

      - name: Smoke install the NSIS package without a desktop
        shell: pwsh
        run: |
          $installer = Get-ChildItem electron-app/dist -File |
            Where-Object Extension -eq '.exe' |
            Select-Object -First 1
          if (-not $installer) {
            throw 'electron-builder did not produce a Windows installer'
          }
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "silent NSIS installation failed with exit code $($process.ExitCode)"
          }
          $installedApp = Join-Path $env:LOCALAPPDATA 'Programs\Fabi\Fabi.exe'
          $installedAsar = Join-Path $env:LOCALAPPDATA 'Programs\Fabi\resources\app.asar'
          if (-not (Test-Path -LiteralPath $installedApp -PathType Leaf)) {
            Write-Host 'Executables found below the per-user Programs directory:'
            Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Filter '*.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
            throw "silent NSIS installation did not create $installedApp"
          }
          if (-not (Test-Path -LiteralPath $installedAsar -PathType Leaf)) {
            throw "silent NSIS installation did not create $installedAsar"
          }

      - name: Record candidate checksums
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem electron-app/dist -File |
            Where-Object { $_.Name -match '\.(exe|blockmap|yml)$' }
          if (-not ($artifacts | Where-Object Extension -eq '.exe')) {
            throw 'electron-builder did not produce a Windows installer'
          }
          $checksumLines = $artifacts | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) }
          $checksumPath = Join-Path (Resolve-Path electron-app/dist) 'SHA256SUMS'
          [IO.File]::WriteAllText(
            $checksumPath,
            ($checksumLines -join "`n") + "`n",
            [Text.Encoding]::ASCII
          )

      - name: Upload the qualification candidate
        uses: actions/upload-artifact@v7
        with:
          name: fabi-windows-x64-candidate
          path: |
            electron-app/dist/*.exe
            electron-app/dist/*.blockmap
            electron-app/dist/*.yml
            electron-app/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
