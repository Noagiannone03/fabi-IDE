<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Fabi</title>
  <style>
    @keyframes fabi-rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fabi-sweep { 0% { transform: translateX(-120%); } 100% { transform: translateX(420%); } }

    html, body {
      margin: 0; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none; user-select: none;
    }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background:
        radial-gradient(130% 90% at 50% 0%, #2a1d14 0%, #15100d 45%, #0b0807 100%);
      color: #fff7f1;
    }
    .fox {
      width: 128px; height: auto; image-rendering: pixelated;
      filter: drop-shadow(0 14px 30px rgba(236, 91, 43, 0.45));
      animation: fabi-rise 0.5s ease both;
    }
    .wordmark {
      font-size: 46px; font-weight: 700; letter-spacing: -1px; margin: 18px 0 4px;
      color: #EC5B2B;
      animation: fabi-rise 0.5s ease 0.08s both;
    }
    /* Wordmark uniforme : « Fa » et « bi » dans la MÊME couleur orange. */
    .wordmark .fa, .wordmark .bi { color: #EC5B2B; }
    .tagline {
      font-size: 13px; opacity: 0.65; margin: 0;
      animation: fabi-rise 0.5s ease 0.16s both;
    }
    .bar {
      position: relative; width: 180px; height: 3px; margin-top: 30px;
      background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden;
      animation: fabi-rise 0.5s ease 0.24s both;
    }
    .bar::after {
      content: ""; position: absolute; top: 0; left: 0; height: 100%; width: 30%;
      background: linear-gradient(90deg, transparent, #EC5B2B, #FF7A4F, transparent);
      animation: fabi-sweep 1.3s ease-in-out infinite;
    }
    .footer { position: absolute; bottom: 16px; font-size: 11px; opacity: 0.35; }
  </style>
</head>
<body>
  <img class="fox" src="./fabi-fox.png" alt="Fabi" />
  <div class="wordmark"><span class="fa">Fa</span><span class="bi">bi</span></div>
  <p class="tagline">Peer-to-peer AI for your code.</p>
  <div class="bar"></div>
  <div class="footer">basé sur Eclipse Theia</div>
</body>
</html>
