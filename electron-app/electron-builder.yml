# Packaging de l'app Fabi (Electron) — adapté de la référence theia-blueprint.
# Produit un .app/.dmg (macOS), .exe NSIS (Windows), AppImage/.deb (Linux), avec
# le nom « Fabi » et les icônes par OS. Lancer après `yarn bundle` (theia build).

appId: fr.undefinedstudio.fabi
productName: Fabi
copyright: Copyright © 2026 undefined studio
electronVersion: 39.8.7
asar: true
# Modules natifs de Theia : doivent rester décompressés hors de l'asar.
asarUnpack:
  - "**/lib/backend/native/**"
  - "**/lib/backend/shell-integrations/**"
  - "**/lib/prebuilds/**"
nodeGypRebuild: false
npmRebuild: false

directories:
  buildResources: resources

# Ce qui entre dans l'app packagée (le bundle Theia + nos resources).
files:
  - src-gen
  - lib
  - resources
  - "!**/node_modules/**"

# Les plugins VS Code (thèmes d'icônes) téléchargés par `theia download:plugins`.
# Présents dans electron-app/plugins → copiés dans Contents/Resources/app/plugins.
extraResources:
  - from: plugins
    to: app/plugins
    filter:
      - "**/*"
  - from: ../fabi-spaces/resources/rail
    to: fabi-spaces/resources/rail
    filter:
      - "**/*"

mac:
  icon: resources/fabi.icns
  category: public.app-category.developer-tools
  darkModeSupport: true
  # Fabi opens projects chosen by the user. macOS protects these locations and
  # displays these strings when consent is required. The native Theia open
  # dialog remains the authority that grants access; these keys do not request
  # broad filesystem access on their own.
  extendInfo:
    NSDocumentsFolderUsageDescription: Fabi accède aux projets que vous choisissez dans Documents pour les lire et les modifier.
    NSDesktopFolderUsageDescription: Fabi accède aux projets que vous choisissez sur le Bureau pour les lire et les modifier.
    NSDownloadsFolderUsageDescription: Fabi accède aux projets que vous choisissez dans Téléchargements pour les lire et les modifier.
    NSNetworkVolumesUsageDescription: Fabi accède aux projets que vous choisissez sur un volume réseau pour les lire et les modifier.
    NSRemovableVolumesUsageDescription: Fabi accède aux projets que vous choisissez sur un volume amovible pour les lire et les modifier.
  target:
    - dmg
    - zip

win:
  icon: resources/icon.ico
  target:
    - nsis

linux:
  icon: resources/icons
  category: Development
  vendor: undefined studio
  target:
    - AppImage
    - deb

nsis:
  menuCategory: true
  # Le chemin assiste historique appelle des plugins UI NSIS meme avec /S et
  # n'est pas fiable dans une session Windows sans bureau. Fabi est une app
  # per-user sans elevation : le one-click maintenu par electron-builder est
  # aussi le chemin attendu par electron-updater pour une mise a jour muette.
  oneClick: true
  perMachine: false
  allowElevation: false
  packElevateHelper: false
  installerHeaderIcon: resources/icon.ico
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  runAfterFinish: false
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
deb:
  artifactName: ${productName}-${version}-${arch}.${ext}
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

# electron-updater génère latest.yml/latest-mac.yml/latest-linux.yml et vérifie
# SHA-512 + signature native avant installation. Le serveur reste un simple
# origin HTTPS : aucune logique d'update n'est réimplémentée côté VPS.
publish:
  provider: generic
  url: https://server.undefinedstudio.fr/fabi-updates/stable
  channel: stable
  useMultipleRangeRequest: false
electronUpdaterCompatibility: ">=2.16"
